<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>厂牌发售 - Media Toolbox</title>
  <link rel="stylesheet" href="{{ url_for('static', path='/style.css') }}?v=apple-20260601">
  <style>
    .maker-search { display: flex; gap: 10px; max-width: 920px; margin-bottom: 18px; }
    .maker-search input { flex: 1; min-height: 42px; padding: 8px 14px; border: 1px solid var(--line-strong); border-radius: 8px; font: inherit; background: #fff; }
    .maker-source { color: var(--muted); font-size: 13px; }
    .maker-tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 14px; }
    .maker-tab { min-height: 34px; padding: 6px 14px; border: 1px solid var(--line-strong); border-radius: 8px; background: #fff; color: var(--muted); cursor: pointer; font: inherit; font-size: 13px; font-weight: 800; white-space: nowrap; }
    .maker-tab.active { border-color: var(--brand); background: var(--green-soft); color: var(--brand); }
    .maker-add { min-width: 42px; color: var(--brand); font-size: 18px; }
    .maker-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); align-items: start; gap: 14px; margin-top: 16px; }
    .maker-card { display: flex; flex-direction: column; overflow: hidden; border: 1px solid var(--line); border-radius: 8px; background: #fff; }
    .maker-card > a { display: block; aspect-ratio: 4/3; overflow: hidden; background: var(--soft); }
    .maker-card img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: center center; }
    .maker-card-body { display: flex; flex: 1; flex-direction: column; gap: 7px; padding: 12px; }
    .maker-meta { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
    .maker-meta strong { color: var(--brand); }
    .maker-meta small { color: var(--muted); }
    .maker-title { min-height: 62px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; font-size: 13px; font-weight: 800; line-height: 1.55; }
    .maker-actions { display: flex; gap: 7px; margin-top: auto; }
    .maker-actions .button { flex: 1; min-height: 34px; padding: 6px 8px; text-align: center; text-decoration: none; }
    .maker-empty { padding: 36px 0; color: var(--muted); }
    .maker-modal { position: fixed; inset: 0; z-index: 60; display: none; padding: 28px; overflow: auto; background: rgba(15, 23, 42, .36); }
    .maker-modal.show { display: block; }
    .maker-modal-box { position: relative; max-width: 1180px; margin: 0 auto; padding: 24px; border-radius: 8px; background: #fff; box-shadow: 0 20px 60px rgba(15, 23, 42, .22); }
    .maker-modal-box.subscribe-modal-box { width: 90%; max-width: 620px; max-height: 80vh; overflow-y: auto; border-radius: 16px; }
    .maker-modal-close { position: absolute; top: 14px; right: 16px; border: 0; background: transparent; color: var(--muted); cursor: pointer; font-size: 28px; line-height: 1; }
    .detail-layout { display: grid; grid-template-columns: minmax(180px, 260px) minmax(0, 1fr); gap: 22px; }
    .detail-cover { width: 100%; aspect-ratio: 2/3; object-fit: cover; border-radius: 8px; background: var(--soft); }
    .detail-info { display: grid; align-content: start; gap: 10px; }
    .detail-code { color: var(--brand); font-size: 24px; font-weight: 900; }
    .detail-title { margin: 0 32px 4px 0; font-size: 18px; line-height: 1.45; }
    .detail-meta-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 14px; margin-top: 4px; }
    .detail-meta-row { min-width: 0; padding: 9px 0; border-bottom: 1px solid var(--line); color: var(--muted); font-size: 13px; line-height: 1.6; }
    .detail-meta-row strong { display: block; color: var(--ink); font-size: 12px; }
    .detail-tags { display: flex; flex-wrap: wrap; gap: 6px; }
    .detail-tag { display: inline-flex; align-items: center; min-height: 24px; padding: 3px 8px; border-radius: 14px; background: var(--green-soft); color: var(--brand); font-size: 12px; font-weight: 800; text-decoration: none; }
    button.detail-tag { border: 0; cursor: pointer; font: inherit; }
    .detail-section { margin-top: 24px; }
    .detail-section-hd { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
    .detail-trailer { width: 100%; min-height: 360px; border: 0; border-radius: 8px; background: #000; }
    .detail-screenshots { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
    .detail-screenshots a { display: block; overflow: hidden; border-radius: 6px; background: var(--soft); }
    .detail-screenshots img { display: block; width: 100%; aspect-ratio: 16/10; object-fit: cover; }
    .subscribe-head { display: flex; align-items: center; gap: 16px; margin: 0 34px 16px 0; }
    .subscribe-head img { width: 80px; height: 107px; flex: 0 0 auto; border-radius: 10px; object-fit: cover; object-position: right center; background: var(--soft); }
    .subscribe-head h3 { margin: 0 0 4px; font-size: 18px; line-height: 1.25; }
    .subscribe-head p { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.45; }
    .subscribe-form { display: grid; gap: 14px; }
    .subscribe-options { display: grid; grid-template-columns: 1fr; gap: 12px; }
    .subscribe-row { display: flex; align-items: center; justify-content: space-between; gap: 18px; min-height: 24px; font-size: 15px; font-weight: 700; }
    .subscribe-row input[type="checkbox"] { width: 44px; height: 24px; accent-color: var(--brand); }
    .subscribe-sizes { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .subscribe-field label, .subscribe-mode-title { display: block; margin-bottom: 6px; font-size: 13px; font-weight: 700; }
    .subscribe-field input { width: 100%; min-height: 38px; padding: 8px 10px; border: 1px solid var(--line-strong); border-radius: 8px; font: inherit; font-weight: 400; }
    .subscribe-mode { display: grid; gap: 10px; }
    .subscribe-mode label { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 700; }
    .subscribe-mode input { width: 18px; height: 18px; accent-color: var(--brand); }
    .subscribe-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 4px; }
  </style>
</head>
<body>
  <div class="console-shell console-two-column">
    <aside class="console-sidebar">
      <div class="brand">
        <div class="brand-mark">M</div>
        <div>
          <h1>Media Toolbox</h1>
          <p>媒体去重控制台</p>
        </div>
      </div>
      {% include "partials/sidebar_nav.html" %}
    </aside>

    <main class="console-main">
      <header class="console-top">
        <div>
          <h2 id="makerTitle">厂牌发售</h2>
          <p>切换常驻厂牌，查看 javdb 最近更新。</p>
        </div>
      </header>
      <div class="maker-tabs" id="makerTabs"></div>
      <div class="maker-search">
        <input id="makerInput" placeholder="输入厂商名称，比如 S1 NO.1 STYLE">
        <button class="button primary" onclick="searchMaker()">搜索</button>
        <button class="button ghost" onclick="refreshMaker()">刷新当前厂牌</button>
      </div>
      <p class="maker-source" id="makerSource"></p>
      <div id="makerResults"><div class="maker-empty">从番号详情点击厂商标签，或输入厂商名称搜索。</div></div>
    </main>
  </div>
  <div class="maker-modal" id="makerDetailModal" onclick="if(event.target===this)closeMakerDetail()">
    <div class="maker-modal-box">
      <button class="maker-modal-close" onclick="closeMakerDetail()">&times;</button>
      <div id="makerDetailBody"><div class="maker-empty">加载中...</div></div>
    </div>
  </div>
  <script>
    const params = new URLSearchParams(location.search);
    const sourceUrl = params.get('url') || '';
    const sourceName = params.get('name') || '';
    let configuredMakers = {{ makers | tojson }};
    let activeMaker = null;

    function esc(value) {
      const node = document.createElement('div');
      node.textContent = value || '';
      return node.innerHTML;
    }
    function proxyUrl(url) { return url ? '/api/proxy/image?url=' + encodeURIComponent(url) : ''; }
    function jsArg(value) { return JSON.stringify(value || '').replace(/</g, '\\u003c').replace(/>/g, '\\u003e').replace(/&/g, '\\u0026'); }
    function encodeItem(item) { return "'" + encodeURIComponent(JSON.stringify(item)).replace(/'/g, '%27') + "'"; }
    function makerKey(item) { return (item.name || '') + '|' + (item.url || ''); }

    function catalogDetailUrl(item, subscribe) {
      const makerUrl = activeMaker ? activeMaker.url : sourceUrl;
      const makerName = activeMaker ? activeMaker.name : sourceName;
      return '/makers?url=' + encodeURIComponent(makerUrl || '')
        + '&name=' + encodeURIComponent(makerName || '')
        + '&detail_url=' + encodeURIComponent(item.url || '')
        + '&detail_id=' + encodeURIComponent(item.id || '')
        + (subscribe ? '&subscribe=1' : '');
    }
    function catalogActressUrl(actor) {
      return '#actress-' + encodeURIComponent(actor.id || actor.name || '');
    }
    function makerList() {
      const items = configuredMakers.slice();
      if (sourceUrl && !items.some(item => item.url === sourceUrl)) items.unshift({name: sourceName || '当前厂牌', url: sourceUrl});
      return items;
    }
    function renderMakerTabs() {
      const items = makerList();
      document.getElementById('makerTabs').innerHTML = items.map(item => {
        const active = activeMaker && makerKey(item) === makerKey(activeMaker);
        return '<button class="maker-tab' + (active ? ' active' : '') + '" onclick="selectMaker(' + encodeItem(item) + ')">' + esc(item.name) + '</button>';
      }).join('') + '<button class="maker-tab maker-add" title="新增常驻厂牌" onclick="addPinnedMaker()">+</button>';
    }
    async function addPinnedMaker() {
      const raw = prompt('厂牌：javdb链接', '');
      if (!raw) return;
      const urlMatch = raw.trim().match(/https?:\/\/\S+/);
      const name = urlMatch ? raw.trim().slice(0, urlMatch.index).replace(/[：:|]+$/g, '').trim() : '';
      if (!urlMatch || !name) {
        alert('请输入：厂牌：javdb链接');
        return;
      }
      try {
        await persistPinnedMaker({name: name, url: urlMatch[0].trim()});
      } catch (error) {
        alert('保存常驻厂牌失败: ' + error.message);
      }
    }
    async function persistPinnedMaker(item) {
      configuredMakers = configuredMakers.filter(x => (x.name || '').toLowerCase() !== item.name.toLowerCase() && x.url !== item.url);
      configuredMakers.push(item);
      renderMakerTabs();
      const response = await fetch('/api/subscriptions/settings', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({pinned_makers: configuredMakers}),
      });
      const data = await response.json();
      if (!response.ok) throw new Error(data.detail || '保存失败');
      configuredMakers = data.settings.pinned_makers || configuredMakers;
      selectMaker(item, true);
    }
    function selectMaker(encoded, force) {
      activeMaker = typeof encoded === 'string' ? JSON.parse(decodeURIComponent(encoded)) : encoded;
      renderMakerTabs();
      loadMaker(activeMaker.url, activeMaker.name, force);
    }
    async function loadMaker(url, name, force) {
      const results = document.getElementById('makerResults');
      document.getElementById('makerTitle').textContent = name || '厂牌发售';
      document.getElementById('makerSource').textContent = url ? '数据来源：javdb' : '';
      document.getElementById('makerInput').value = name || '';
      results.innerHTML = '<div class="maker-empty">正在读取 javdb 厂商页...</div>';
      try {
        const response = await fetch('/api/javdb/listing?limit=16&url=' + encodeURIComponent(url) + (force ? '&force=true' : ''));
        const data = await response.json();
        if (!response.ok) throw new Error(data.detail || '读取失败');
        if (!data.results || !data.results.length) {
          results.innerHTML = '<div class="maker-empty">该厂商页暂时没有作品数据。</div>';
          return;
        }
        results.innerHTML = '<div class="maker-grid">' + data.results.map(buildCard).join('') + '</div>';
      } catch (error) {
        results.innerHTML = '<div class="maker-empty">加载失败：' + esc(error.message) + '</div>';
      }
    }
    function buildCard(item) {
      return '<article class="maker-card">'
        + '<a href="' + esc(catalogDetailUrl(item, false)) + '"><img src="' + proxyUrl(item.cover || '') + '" alt="" loading="lazy"></a>'
        + '<div class="maker-card-body"><div class="maker-meta"><strong>' + esc(item.id || '') + '</strong><small>' + esc(item.date || '') + '</small></div>'
        + '<div class="maker-title">' + esc(item.title || '') + '</div>'
        + '<div class="maker-actions"><a class="button ghost" href="' + esc(catalogDetailUrl(item, false)) + '">详情</a>'
        + '<button class="button primary" onclick=\'openMakerAvSubscribeModal(' + jsArg(item) + ')\'>订阅</button></div></div></article>';
    }
    function searchMaker() {
      const name = document.getElementById('makerInput').value.trim();
      if (!name) return;
      const url = 'https://javdb.com/search?q=' + encodeURIComponent(name) + '&f=all';
      location.href = '/makers?url=' + encodeURIComponent(url) + '&name=' + encodeURIComponent(name);
    }
    function refreshMaker() {
      if (activeMaker) selectMaker(activeMaker, true);
    }
    async function showMakerActressDetail(name, actressId) {
      const modal = document.getElementById('makerDetailModal');
      const body = document.getElementById('makerDetailBody');
      setMakerModalMode('detail');
      modal.classList.add('show');
      body.innerHTML = '<div class="maker-empty">正在读取 ' + esc(name || actressId) + ' 的作品...</div>';
      try {
        let id = actressId || '';
        if (!id && name) {
          const search = await fetch('/api/subscriptions/search?q=' + encodeURIComponent(name) + '&type=actress');
          const found = await search.json();
          if (found.results && found.results.length) id = found.results[0].id || '';
        }
        if (!id) {
          body.innerHTML = '<div class="maker-empty">未找到该女优的 javdb ID。</div>';
          return;
        }
        const [avsResponse, profileResponse] = await Promise.all([
          fetch('/api/subscriptions/actress/' + encodeURIComponent(id) + '/avs'),
          fetch('/api/subscriptions/actress/' + encodeURIComponent(id) + '/profile').catch(() => null),
        ]);
        const avsData = await avsResponse.json();
        const profileData = profileResponse ? await profileResponse.json() : {};
        if (!avsResponse.ok) throw new Error(avsData.detail || '作品读取失败');
        const profile = (profileData && profileData.profile) || {};
        const title = profile.name || name || id;
        const cover = profile.cover ? '<img class="detail-cover" src="' + proxyUrl(profile.cover) + '" alt="">' : '<div class="maker-empty">无封面</div>';
        let html = '<div class="detail-layout"><div>' + cover + '</div><div class="detail-info">'
          + '<div class="detail-code">' + esc(title) + '</div>'
          + '<h3 class="detail-title">' + esc((avsData.results || []).length + ' 部作品（来自 javdb）') + '</h3>'
          + '<div><button class="button primary" onclick=\'openMakerActressSubscribe(' + jsArg({id: id, name: title, cover: profile.cover || ''}) + ')\'>订阅女优</button></div>'
          + '</div></div>';
        if (!avsData.results || !avsData.results.length) {
          html += '<div class="maker-empty">暂无作品数据。</div>';
        } else {
          html += '<div class="maker-grid">' + avsData.results.map(buildCard).join('') + '</div>';
        }
        body.innerHTML = html;
      } catch (error) {
        body.innerHTML = '<div class="maker-empty">加载失败：' + esc(error.message) + '</div>';
      }
    }
    function openMakerActressSubscribe(item) {
      fetch('/api/subscriptions/actress', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          id: item.id,
          name: item.name || '',
          cover: item.cover || '',
          since_date: new Date().toISOString().slice(0, 10),
          poll_enabled: true,
          include_vr: false,
        }),
      }).then(response => response.json()).then(data => {
        if (data.status !== 'ok') throw new Error(data.detail || '订阅失败');
        alert('已订阅女优');
      }).catch(error => alert('订阅失败：' + error.message));
    }
    async function showMakerAvDetail(url, id, subscribe) {
      const modal = document.getElementById('makerDetailModal');
      const body = document.getElementById('makerDetailBody');
      setMakerModalMode('detail');
      modal.classList.add('show');
      body.innerHTML = '<div class="maker-empty">正在读取 javdb 详情...</div>';
      try {
        const response = await fetch('/api/subscriptions/av/detail?url=' + encodeURIComponent(url));
        const data = await response.json();
        if (!response.ok) throw new Error(data.detail || '详情读取失败');
        const detail = data.detail || {};
        const item = {
          id: detail.id || id || '',
          title: detail.title || '',
          cover: detail.cover || '',
          date: detail.release_date || '',
          actresses: detail.actors || [],
          url: detail.url || url,
        };
        body.innerHTML = buildMakerDetail(detail, item);
        if (subscribe) openMakerAvSubscribeModal(item);
      } catch (error) {
        body.innerHTML = '<div class="maker-empty">加载失败：' + esc(error.message) + '</div>';
      }
    }
    function buildMakerDetail(detail, item) {
      const renderMeta = (label, value) => value ? '<div class="detail-meta-row"><strong>' + label + '</strong>' + value + '</div>' : '';
      const renderLinks = (items, type) => (items || []).map(x => {
        if (!x || !x.name) return '';
        if (type === 'maker' && x.url) return '<a class="detail-tag" href="/makers?url=' + encodeURIComponent(x.url) + '&name=' + encodeURIComponent(x.name) + '">' + esc(x.name) + '</a>';
        if (type === 'actor') {
          const match = String(x.url || '').match(/\/actors\/([A-Za-z0-9]+)$/);
          return '<button class="detail-tag" onclick=\'showMakerActressDetail(' + jsArg(x.name || '') + ', ' + jsArg(match ? match[1] : '') + ')\'>' + esc(x.name) + '</button>';
        }
        return x.url ? '<a class="detail-tag" target="_blank" rel="noreferrer" href="' + esc(x.url) + '">' + esc(x.name) + '</a>' : '<span class="detail-tag">' + esc(x.name) + '</span>';
      }).join('');
      let html = '<div class="detail-layout">';
      html += '<div>' + (detail.cover ? '<img class="detail-cover" src="' + proxyUrl(detail.cover) + '" alt="">' : '<div class="maker-empty">无封面</div>') + '</div>';
      html += '<div class="detail-info"><div class="detail-code">' + esc(item.id || '') + '</div>';
      html += '<h3 class="detail-title">' + esc(detail.title || item.title || '') + '</h3>';
      html += '<div><button id="makerSubscribeButton" class="button primary" onclick=\'openMakerAvSubscribeModal(' + jsArg(item) + ')\'>订阅番号</button> <a class="button ghost" target="_blank" rel="noreferrer" href="' + esc(detail.url || item.url || '#') + '">打开 javdb</a></div>';
      html += '<div class="detail-meta-grid">';
      html += renderMeta('发售日期', esc(detail.release_date || ''));
      html += renderMeta('时长', esc(detail.duration || ''));
      html += renderMeta('评分', esc(detail.rating || ''));
      html += renderMeta('导演', renderLinks((detail.director && detail.director.links) || [], 'director'));
      html += renderMeta('厂商', renderLinks((detail.maker && detail.maker.links) || [], 'maker'));
      html += renderMeta('演员', renderLinks(detail.actors || [], 'actor'));
      html += '</div>';
      if (detail.tags && detail.tags.length) html += '<div class="detail-tags">' + renderLinks(detail.tags, 'tag') + '</div>';
      html += '</div></div>';
      html += '<section class="detail-section"><div class="detail-section-hd"><h4>预告</h4></div>';
      html += detail.trailer ? renderMakerTrailer(detail.trailer) : '<div class="maker-empty">javdb 当前没有提供预告</div>';
      html += '</section>';
      if (detail.screenshots && detail.screenshots.length) {
        html += '<section class="detail-section"><div class="detail-section-hd"><h4>剧照</h4><small>' + detail.screenshots.length + ' 张</small></div><div class="detail-screenshots">';
        detail.screenshots.forEach(src => {
          html += '<a target="_blank" rel="noreferrer" href="' + esc(src) + '"><img src="' + proxyUrl(src) + '" alt="" loading="lazy"></a>';
        });
        html += '</div></section>';
      }
      return html;
    }
    function renderMakerTrailer(url) {
      const safe = esc(url);
      if (/\.(mp4|webm|m3u8)(\?|$)/i.test(url)) return '<video class="detail-trailer" controls preload="metadata" src="' + safe + '"></video>';
      return '<iframe class="detail-trailer" loading="lazy" allowfullscreen src="' + safe + '"></iframe>';
    }
    function openMakerAvSubscribeModal(item) {
      const modal = document.getElementById('makerDetailModal');
      const body = document.getElementById('makerDetailBody');
      setMakerModalMode('subscribe');
      modal.classList.add('show');
      body.innerHTML = '<div class="subscribe-head">'
        + (item.cover ? '<img src="' + proxyUrl(item.cover) + '" alt="">' : '<div class="maker-empty">无封面</div>')
        + '<div><h3>订阅 ' + esc(item.id || '') + '</h3><p>' + esc(item.title || '') + '</p></div></div>'
        + '<form class="subscribe-form" onsubmit=\'event.preventDefault();submitMakerAvSubscribe(' + jsArg(item) + ', this)\'>'
        + '<div class="subscribe-options">'
        + subscribeCheckbox('only_chinese', '仅中文')
        + subscribeCheckbox('only_uncensored', '仅无码')
        + subscribeCheckbox('exclude_uncensored', '排除无码')
        + subscribeCheckbox('only_free', '仅免费')
        + subscribeCheckbox('only_uhd', '仅 UHD')
        + subscribeCheckbox('exclude_uhd', '排除 UHD')
        + '</div>'
        + '<div class="subscribe-sizes">'
        + '<div class="subscribe-field"><label>最小体积(MB)</label><input name="min_size_mb" inputmode="numeric"></div>'
        + '<div class="subscribe-field"><label>最大体积(MB)</label><input name="max_size_mb" inputmode="numeric"></div>'
        + '</div>'
        + '<div><span class="subscribe-mode-title">订阅模式</span><div class="subscribe-mode">'
        + '<label><input type="radio" name="subscription_mode" value="strict" checked>严格模式</label>'
        + '<label><input type="radio" name="subscription_mode" value="predownload">预下载模式</label>'
        + '</div></div>'
        + '<div class="subscribe-actions"><button type="button" class="button ghost" onclick="closeMakerDetail()">取消</button><button type="submit" class="button primary">确认</button></div>'
        + '</form>';
    }
    function subscribeCheckbox(name, label) {
      return '<label class="subscribe-row"><span>' + label + '</span><input type="checkbox" name="' + name + '"></label>';
    }
    function setMakerModalMode(mode) {
      const box = document.querySelector('#makerDetailModal .maker-modal-box');
      if (!box) return;
      box.classList.toggle('subscribe-modal-box', mode === 'subscribe');
    }
    function readSubscribeFilters(form) {
      const valueOf = name => (form.elements[name] && form.elements[name].value) || '';
      const checked = name => !!(form.elements[name] && form.elements[name].checked);
      return {
        only_chinese: checked('only_chinese'),
        only_uncensored: checked('only_uncensored'),
        exclude_uncensored: checked('exclude_uncensored'),
        only_free: checked('only_free'),
        only_uhd: checked('only_uhd'),
        exclude_uhd: checked('exclude_uhd'),
        min_size_mb: valueOf('min_size_mb'),
        max_size_mb: valueOf('max_size_mb'),
      };
    }
    async function submitMakerAvSubscribe(item, form) {
      const button = form.querySelector('button[type="submit"]');
      item = Object.assign({}, item, {
        filters: readSubscribeFilters(form),
        subscription_mode: form.querySelector('input[name="subscription_mode"]:checked')?.value || 'strict',
      });
      return subscribeMakerAv(item, button);
    }
    async function subscribeMakerAv(item, button) {
      if (!item || !item.id) return;
      const original = button ? button.textContent : '';
      if (button) {
        button.disabled = true;
        button.textContent = '订阅中...';
      }
      try {
        const response = await fetch('/api/subscriptions/av', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify(item),
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.detail || '订阅失败');
        if (button) button.textContent = '已订阅';
        setTimeout(closeMakerDetail, 450);
      } catch (error) {
        if (button) {
          button.disabled = false;
          button.textContent = original || '订阅番号';
        }
        alert('订阅失败：' + error.message);
      }
    }
    function closeMakerDetail() {
      document.getElementById('makerDetailModal').classList.remove('show');
    }
    document.addEventListener('click', event => {
      const link = event.target.closest && event.target.closest('.maker-card a[href*="detail_url="]');
      if (!link) return;
      const target = new URL(link.href, location.origin);
      const detailUrl = target.searchParams.get('detail_url') || '';
      if (!detailUrl) return;
      event.preventDefault();
      history.replaceState(null, '', target.pathname + target.search);
      showMakerAvDetail(detailUrl, target.searchParams.get('detail_id') || '', target.searchParams.get('subscribe') === '1');
    });
    document.getElementById('makerInput').addEventListener('keydown', event => {
      if (event.key === 'Enter') searchMaker();
    });
    const initial = sourceUrl ? {name: sourceName || '当前厂牌', url: sourceUrl} : makerList()[0];
    if (initial) selectMaker(initial);
    else renderMakerTabs();
    const detailUrl = params.get('detail_url') || '';
    if (detailUrl) showMakerAvDetail(detailUrl, params.get('detail_id') || '', params.get('subscribe') === '1');
  </script>
</body>
</html>
